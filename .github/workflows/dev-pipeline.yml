name: Terraform Workflow

on:
  push:
    branches: [reactor]  # Trigger workflow on push to the 'main' branch
  pull_request:
    branches: [reactor]  # Trigger workflow on pull request to the 'main' branch

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v2

    # Set up Terraform
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.5.0  # You can specify a version of Terraform here

    # Cache Terraform provider plugins (optional but speeds up subsequent runs)
    - name: Cache Terraform Providers
      uses: actions/cache@v2
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-${{ runner.os }}-${{ hashFiles('**/*.tf') }}
        restore-keys: |
          terraform-${{ runner.os }}-

    # Authenticate to GCP (or another cloud provider)
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v0
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}  # Use a GCP service account key stored in GitHub Secrets

    # Initialize Terraform
    - name: Terraform Init
      run: terraform init

    # Run Terraform Plan
    - name: Terraform Plan
      run: terraform plan -out=tfplan

    # Apply Terraform changes (only on push to main)
    - name: Terraform Apply
      if: github.event_name == 'push'  # Apply only if it's a push event (not PR)
      run: terraform apply -auto-approve tfplan

    # Optional: Output the Terraform state
    - name: Output Terraform State
      run: terraform show terraform.tfstate